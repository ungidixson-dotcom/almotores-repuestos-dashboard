name: Sync Dropbox y Vehiculos

on:
  workflow_dispatch:
    inputs:
      sede:
        description: 'Sede'
        required: false
        default: ''
      mes:
        description: 'Mes'
        required: false
        default: ''
  schedule:
    - cron: '0 14 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install openpyxl requests supabase python-dotenv PyJWT cryptography

      - name: Sync Dropbox Accesorios
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          DROPBOX_TOKEN:          ${{ secrets.DROPBOX_TOKEN }}
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:     ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_PATH_NORTE:     ${{ secrets.DROPBOX_PATH_NORTE }}
          DROPBOX_PATH_PASOANCHO: ${{ secrets.DROPBOX_PATH_PASOANCHO }}
          DROPBOX_PATH_CALLE9:    ${{ secrets.DROPBOX_PATH_CALLE9 }}
        run: cd .github/scripts && python sync.py

      - name: Sync Google Sheets Vehiculos
        env:
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:        ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SHEET_ID:             1fs779BGplnVfzkkI247kx30clyQ5lxwMUgzSdPbpyRI
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: cd .github/scripts && python sync_vehiculos.py

      - name: Done
        if: always()
        run: echo "Sync OK $(date)"
